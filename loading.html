<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="animations.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="devil-loader" id="devilLoader">
    <div class="devil-character">
      <!-- Devil Head -->
      <div class="devil-head">
        <!-- Horns -->
        <div class="devil-horn left"></div>
        <div class="devil-horn right"></div>
        
        <!-- Eyes -->
        <div class="devil-eye left"></div>
        <div class="devil-eye right"></div>
        
        <!-- Smile -->
        <div class="devil-smile"></div>
        
        <!-- Fangs -->
        <div class="devil-fang left"></div>
        <div class="devil-fang right"></div>
      </div>
      
      <!-- Body -->
      <div class="devil-body"></div>
      
      <!-- Tail -->
      <div class="devil-tail"></div>
      
      <!-- Fire Particles -->
      <div class="fire-particle"></div>
      <div class="fire-particle"></div>
      <div class="fire-particle"></div>
      <div class="fire-particle"></div>
      <div class="fire-particle"></div>
    </div>
    
    <div class="loading-text">
      Loading
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>

  <script>
    // Simulate loading
    setTimeout(() => {
      document.getElementById('devilLoader').classList.add('hidden');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 600);
    }, 3000);
  </script>
</body>
</html>
