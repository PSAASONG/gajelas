<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - WhiteGpt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-dark: #0f0f0f;
            --bg-sidebar: #1a1a1a;
            --bg-card: #2d2d2d;
            --border: #404040;
            --accent: #ff4444;
            --text: #fff;
            --text-muted: #888;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .admin-sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: width 0.3s;
            overflow: hidden;
        }
        .admin-sidebar.collapsed { width: 70px; }
        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        .sidebar-brand i { color: var(--accent); font-size: 24px; }
        .sidebar-brand span { font-size: 18px; font-weight: 700; }
        .admin-sidebar.collapsed .sidebar-brand span { display: none; }
        #toggle-sidebar {
            width: 36px; height: 36px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .admin-sidebar.collapsed #toggle-sidebar i { transform: rotate(180deg); }
        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
        }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .nav-item:hover { background: rgba(255,68,68,0.1); color: var(--text); }
        .nav-item.active { background: rgba(255,68,68,0.2); color: var(--accent); border-left: 3px solid var(--accent); }
        .admin-sidebar.collapsed .nav-item span { display: none; }
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .logout-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .admin-sidebar.collapsed .logout-btn span { display: none; }
        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main-header {
            padding: 20px 30px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .main-header h1 { font-size: 24px; }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        .content-area {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
        }
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .stat-icon {
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .stat-icon.blue { background: rgba(33,150,243,0.15); color: #2196f3; }
        .stat-icon.green { background: rgba(76,175,80,0.15); color: #4caf50; }
        .stat-info h3 { font-size: 24px; margin-bottom: 4px; }
        .stat-info p { color: var(--text-muted); font-size: 13px; }
        /* User list untuk live chat */
        .user-list-container {
            background: var(--bg-sidebar);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .user-list-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }
        .user-items {
            max-height: 300px;
            overflow-y: auto;
        }
        .user-item {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .user-item:hover { background: rgba(255,68,68,0.1); }
        .user-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; }
        .user-preview { font-size: 12px; color: var(--text-muted); }
        .unread-badge {
            background: var(--accent);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            margin-left: 5px;
        }
        /* Modal chat (popup seperti WA) */
        .chat-modal {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 500px;
            background: var(--bg-sidebar);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            flex-direction: column;
            z-index: 1000;
        }
        .chat-modal.active { display: flex; }
        .chat-modal-header {
            padding: 15px 20px;
            background: #1a1a1a;
            border-radius: 16px 16px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .chat-modal-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-modal-avatar {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-modal-close {
            width: 32px; height: 32px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 50%;
        }
        .chat-modal-close:hover { background: var(--accent); }
        .chat-modal-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13px;
        }
        .message.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
        }
        .message.admin {
            background: #404040;
            color: white;
            align-self: flex-start;
        }
        .message-footer {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            text-align: right;
        }
        .chat-modal-input {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
        }
        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 5px 5px 5px 15px;
        }
        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px 0;
        }
        .chat-send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
        }
        /* User Management Table */
        .users-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-sidebar);
            border-radius: 12px;
            overflow: hidden;
        }
        .users-table th {
            text-align: left;
            padding: 15px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }
        .users-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }
        .role-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .role-badge.admin { background: rgba(255,68,68,0.2); color: #ff4444; }
        .role-badge.user { background: rgba(33,150,243,0.2); color: #2196f3; }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
        }
        .action-btn:hover { color: var(--accent); }
        .add-user-btn {
            margin-bottom: 15px;
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        /* Modal User */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-sidebar);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .cancel-btn, .submit-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .cancel-btn { background: #333; color: white; }
        .submit-btn { background: var(--accent); color: white; }
        /* Devil Loader */
        .devil-loader {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: linear-gradient(135deg,#1a1a1a,#2d2d2d);
            z-index:9999;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            transition:opacity 0.5s;
        }
        .devil-loader.hidden { opacity:0; pointer-events:none; }
    </style>
</head>
<body>
    <!-- DEVIL LOADER -->
    <div class="devil-loader" id="devil-loader">
        <div class="devil-character">...</div>
        <div class="loading-text">Loading <div class="loading-dots"><span></span><span></span><span></span></div></div>
        <div class="loading-progress"><div class="loading-progress-bar"></div></div>
    </div>

    <!-- SIDEBAR -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fas fa-bolt"></i>
                <span>Admin Panel</span>
            </div>
            <button id="toggle-sidebar"><i class="fas fa-chevron-left"></i></button>
        </div>
        <div class="sidebar-nav">
            <div class="nav-item active" onclick="showSection('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
            <div class="nav-item" onclick="showSection('chat')"><i class="fas fa-comments"></i><span>Live Chat</span></div>
            <div class="nav-item" onclick="showSection('users')"><i class="fas fa-users-cog"></i><span>User Management</span></div>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="admin-main">
        <div class="main-header">
            <h1 id="section-title">Dashboard</h1>
            <div class="status-badge"><span class="status-dot"></span><span>Online</span></div>
        </div>
        <div class="content-area" id="content-area">
            <!-- DASHBOARD -->
            <div id="dashboard-section">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3 id="total-users">0</h3><p>Total Users</p></div></div>
                    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-user-shield"></i></div><div class="stat-info"><h3 id="total-admins">0</h3><p>Admins</p></div></div>
                </div>
                <div style="color:var(--text-muted); text-align:center; padding:40px;">
                    <i class="fas fa-chart-line" style="font-size:48px; opacity:0.5;"></i>
                    <p>Statistik real-time</p>
                </div>
            </div>
            <!-- LIVE CHAT SECTION -->
            <div id="chat-section" style="display:none;">
                <div class="user-list-container">
                    <div class="user-list-header">Users</div>
                    <div class="user-items" id="user-items"></div>
                </div>
            </div>
            <!-- USER MANAGEMENT -->
            <div id="users-section" style="display:none;">
                <button class="add-user-btn" onclick="openUserModal()"><i class="fas fa-plus"></i> Tambah User</button>
                <table class="users-table">
                    <thead><tr><th>Username</th><th>Role</th><th>Aksi</th></tr></thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CHAT (POPUP BALAS SEPERTI WA) -->
    <div id="chat-modal" class="chat-modal">
        <div class="chat-modal-header">
            <div class="chat-modal-user">
                <div class="chat-modal-avatar"><i class="fas fa-user"></i></div>
                <div>
                    <h5 id="chat-modal-username">User</h5>
                    <span style="font-size:11px; color:#4caf50;">● Online</span>
                </div>
            </div>
            <button class="chat-modal-close" onclick="closeChatModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-modal-messages" id="chat-modal-messages"></div>
        <div class="chat-modal-input">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-modal-input" placeholder="Ketik balasan...">
                <button class="chat-send-btn" onclick="sendAdminReply()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- MODAL USER -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modal-title">Tambah User</h3><button class="modal-close" onclick="closeUserModal()"><i class="fas fa-times"></i></button></div>
            <form id="user-form" onsubmit="saveUser(event)">
                <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
                <div class="form-group"><label>Password</label><input type="text" id="password" required></div>
                <div class="form-group"><label>Role</label><select id="role"><option value="user">User</option><option value="admin">Admin</option></select></div>
                <div class="modal-actions"><button type="button" class="cancel-btn" onclick="closeUserModal()">Batal</button><button type="submit" class="submit-btn">Simpan</button></div>
            </form>
        </div>
    </div>

    <script src="role-manager.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser')||'{}');
        if (!currentUser.username || currentUser.role!=='admin') { alert('Akses ditolak'); window.location.href='login.html'; }

        // Sidebar toggle
        const sidebar = document.getElementById('adminSidebar');
        document.getElementById('toggle-sidebar').addEventListener('click', ()=>sidebar.classList.toggle('collapsed'));

        let users = JSON.parse(localStorage.getItem('users_db')||'[]');
        if (users.length===0) {
            users = [
                { id:1, username:'admin', password:'admin123', role:'admin' },
                { id:2, username:'user', password:'user123', role:'user' }
            ];
            localStorage.setItem('users_db',JSON.stringify(users));
        }

        let liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages')||'[]');
        let selectedUserId = null;

        // Set admin online
        localStorage.setItem('admin_online','true');
        localStorage.setItem('admin_last_activity',Date.now().toString());

        function showSection(section) {
            document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
            if (section==='dashboard') {
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
                document.getElementById('dashboard-section').style.display='block';
                document.getElementById('chat-section').style.display='none';
                document.getElementById('users-section').style.display='none';
                document.getElementById('section-title').innerText='Dashboard';
                updateStats();
            } else if (section==='chat') {
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
                document.getElementById('dashboard-section').style.display='none';
                document.getElementById('chat-section').style.display='block';
                document.getElementById('users-section').style.display='none';
                document.getElementById('section-title').innerText='Live Chat';
                loadUserList();
            } else {
                document.querySelector('.nav-item:nth-child(3)').classList.add('active');
                document.getElementById('dashboard-section').style.display='none';
                document.getElementById('chat-section').style.display='none';
                document.getElementById('users-section').style.display='block';
                document.getElementById('section-title').innerText='User Management';
                loadUsers();
            }
        }

        function updateStats() {
            document.getElementById('total-users').innerText = users.length;
            document.getElementById('total-admins').innerText = users.filter(u=>u.role==='admin').length;
        }

        // ========== LIVE CHAT ==========
        function loadUserList() {
            const container = document.getElementById('user-items');
            const userMessages = liveChatMessages.filter(m=>m.sender==='user');
            const uniqueUsers = [...new Set(userMessages.map(m=>m.sender))];

            if (uniqueUsers.length===0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">Belum ada chat</div>';
                return;
            }

            container.innerHTML = '';
            uniqueUsers.forEach(userId => {
                const userMsg = userMessages.filter(m=>m.sender===userId);
                const lastMsg = userMsg[userMsg.length-1];
                const unread = userMsg.filter(m=>!m.read).length;
                const div = document.createElement('div');
                div.className = 'user-item';
                div.onclick = () => openChatModal(userId);
                div.innerHTML = `
                    <div class="user-avatar"><i class="fas fa-user"></i></div>
                    <div class="user-info">
                        <div class="user-name">User ${userId} ${unread ? `<span class="unread-badge">${unread}</span>` : ''}</div>
                        <div class="user-preview">${lastMsg.content.substring(0,30)}...</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openChatModal(userId) {
            selectedUserId = userId;
            document.getElementById('chat-modal-username').innerText = `User ${userId}`;
            loadChatMessages(userId);
            document.getElementById('chat-modal').classList.add('active');
        }

        function closeChatModal() {
            document.getElementById('chat-modal').classList.remove('active');
            selectedUserId = null;
        }

        function loadChatMessages(userId) {
            const container = document.getElementById('chat-modal-messages');
            const userMessages = liveChatMessages.filter(m=>m.sender===userId || m.sender==='admin');
            container.innerHTML = '';
            userMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}`;
                div.innerHTML = msg.content + '<div class="message-footer">' + new Date(msg.timestamp).toLocaleTimeString() + '</div>';
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;

            // Tandai pesan user sebagai sudah dibaca
            liveChatMessages.forEach(m => { if (m.sender===userId) m.read = true; });
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            loadUserList();
        }

        function sendAdminReply() {
            const input = document.getElementById('chat-modal-input');
            const text = input.value.trim();
            if (!text || !selectedUserId) return;

            const msg = {
                id: Date.now(),
                content: text,
                sender: 'admin',
                timestamp: new Date().toISOString(),
                read: false
            };
            liveChatMessages.push(msg);
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            input.value = '';
            loadChatMessages(selectedUserId);
        }

        // ========== USER MANAGEMENT ==========
        function loadUsers() {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = users.map(u=>`
                <tr><td>${u.username}</td><td><span class="role-badge ${u.role}">${u.role}</span></td>
                <td><button class="action-btn" onclick="editUser(${u.id})"><i class="fas fa-edit"></i></button>
                <button class="action-btn" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button></td></tr>
            `).join('');
        }

        function openUserModal() {
            document.getElementById('modal-title').innerText='Tambah User';
            document.getElementById('username').value='';
            document.getElementById('password').value='';
            document.getElementById('role').value='user';
            document.getElementById('user-modal').classList.add('active');
        }
        function closeUserModal() { document.getElementById('user-modal').classList.remove('active'); }
        function saveUser(e) {
            e.preventDefault();
            const newUser = {
                id: Date.now(),
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            users.push(newUser);
            localStorage.setItem('users_db',JSON.stringify(users));
            closeUserModal();
            loadUsers();
            updateStats();
        }
        function editUser(id) {
            const u = users.find(u=>u.id===id);
            if (!u) return;
            document.getElementById('modal-title').innerText='Edit User';
            document.getElementById('username').value=u.username;
            document.getElementById('password').value=u.password;
            document.getElementById('role').value=u.role;
            document.getElementById('user-modal').classList.add('active');
            window.editingId = id;
        }
        function deleteUser(id) {
            if (confirm('Hapus user ini?')) {
                users = users.filter(u=>u.id!==id);
                localStorage.setItem('users_db',JSON.stringify(users));
                loadUsers();
                updateStats();
            }
        }

        function logout() {
            localStorage.setItem('admin_online','false');
            localStorage.removeItem('currentUser');
            window.location.href='login.html';
        }

        window.addEventListener('load', ()=>{
            setTimeout(()=>document.getElementById('devil-loader').classList.add('hidden'),1500);
        });

        // Refresh live chat setiap 2 detik
        setInterval(() => {
            liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages')||'[]');
            if (document.getElementById('chat-section').style.display === 'block') loadUserList();
            if (selectedUserId) loadChatMessages(selectedUserId);
        }, 2000);

        showSection('dashboard');
        loadUsers();
        updateStats();
    </script>
