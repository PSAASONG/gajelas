<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - WhiteGpt</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #2d2d2d;
            --border: #404040;
            --accent: #ff4444;
            --success: #4caf50;
            --text: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 30px;
            height: 70px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 28px;
            color: var(--accent);
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
        }

        .status-indicator .status-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76,175,80,0); }
            100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
        }

        .control-btn {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: var(--accent);
        }

        .admin-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .stat-icon.blue { background: rgba(33,150,243,0.15); color: #2196f3; }
        .stat-icon.green { background: rgba(76,175,80,0.15); color: #4caf50; }
        .stat-icon.orange { background: rgba(255,152,0,0.15); color: #ff9800; }
        .stat-icon.red { background: rgba(244,67,54,0.15); color: #f44336; }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-info p {
            color: var(--text-muted);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h2 i {
            color: var(--accent);
        }

        .add-user-btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-user-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        .chat-user-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .chat-user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-user-item:hover {
            background: rgba(255,68,68,0.1);
        }

        .chat-user-avatar {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .chat-user-info {
            flex: 1;
        }

        .chat-user-name {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .unread-badge {
            background: var(--accent);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 11px;
        }

        .chat-last-message {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-time {
            font-size: 10px;
            color: var(--text-muted);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-status {
            font-size: 11px;
            color: var(--success);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 13px;
            word-wrap: break-word;
        }

        .chat-message.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-message.admin {
            background: #404040;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
        }

        .message-status-icons .read {
            color: var(--success);
        }

        .chat-message-image {
            max-width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 5px 5px 5px 15px;
        }

        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px 0;
            font-size: 13px;
        }

        .chat-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .chat-action-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-action-btn:hover {
            background: var(--accent);
            color: white;
        }

        .chat-send-btn {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-send-btn:hover {
            background: #ff6666;
            transform: scale(1.1);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            text-align: left;
            padding: 15px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        .users-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .role-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        .role-badge.admin {
            background: rgba(255,68,68,0.15);
            color: #ff4444;
            border: 1px solid rgba(255,68,68,0.3);
        }

        .role-badge.user {
            background: rgba(33,150,243,0.15);
            color: #2196f3;
            border: 1px solid rgba(33,150,243,0.3);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn {
            background: rgba(33,150,243,0.15);
            color: #2196f3;
            border: 1px solid rgba(33,150,243,0.3);
        }

        .edit-btn:hover {
            background: #2196f3;
            color: white;
        }

        .delete-btn {
            background: rgba(244,67,54,0.15);
            color: #f44336;
            border: 1px solid rgba(244,67,54,0.3);
        }

        .delete-btn:hover {
            background: #f44336;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .modal-close:hover {
            background: #f44336;
        }

        form {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn, .submit-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .cancel-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .submit-btn {
            background: var(--accent);
            color: white;
        }

        .submit-btn:hover {
            background: #ff6666;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--border);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <h1>Admin Panel</h1>
            </div>
            
            <div class="header-right">
                <div class="status-indicator" id="admin-status-header">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>
                <button id="logout-admin" class="control-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="total-users">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="stat-info">
                    <h3 id="total-admins">0</h3>
                    <p>Admins</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-comments"></i>
                </div>
                <div class="stat-info">
                    <h3 id="active-chats">0</h3>
                    <p>Active Chats</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="pending-replies">0</h3>
                    <p>Pending Replies</p>
                </div>
            </div>
        </div>

        <div class="admin-grid">
            <!-- Live Chat Card -->
            <div class="admin-card">
                <div class="card-header">
                    <h2><i class="fas fa-comments"></i> Live Chat Support</h2>
                </div>

                <div class="chat-user-list" id="chat-user-list"></div>

                <div class="chat-area" id="chat-area" style="display: none;">
                    <div class="chat-header">
                        <button class="back-btn" onclick="backToUserList()">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <div class="user-info">
                            <div class="user-avatar" id="selected-user-avatar">👤</div>
                            <div>
                                <h4 id="selected-user-name">Loading...</h4>
                                <span class="user-status" id="selected-user-status">Online</span>
                            </div>
                        </div>
                    </div>

                    <div class="chat-messages" id="admin-chat-messages"></div>

                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <input type="file" id="admin-image-input" accept="image/*" style="display: none;">
                            <button class="chat-action-btn" onclick="document.getElementById('admin-image-input').click()">
                                <i class="fas fa-image"></i>
                            </button>
                            <input type="text" id="admin-chat-input" placeholder="Ketik pesan...">
                            <button class="chat-send-btn" onclick="sendAdminMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Management Card -->
            <div class="admin-card">
                <div class="card-header">
                    <h2><i class="fas fa-users-cog"></i> User Management</h2>
                    <button class="add-user-btn" onclick="openUserModal()">
                        <i class="fas fa-plus"></i> Add User
                    </button>
                </div>

                <div style="overflow-y: auto; flex:1;">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Tambah User Baru</h2>
                <button class="modal-close" onclick="closeUserModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="user-form" onsubmit="saveUser(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="text" id="password" required>
                </div>
                
                <div class="form-group">
                    <label>Role</label>
                    <select id="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeUserModal()">Batal</button>
                    <button type="submit" class="submit-btn">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ========== CEK LOGIN ==========
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (!currentUser.username || currentUser.role !== 'admin') {
            alert('Akses ditolak! Halaman ini khusus admin.');
            window.location.href = 'index.html';
        }

        // ========== STATE ==========
        let users = JSON.parse(localStorage.getItem('users_db') || '[]');
        let liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages') || '[]');
        let selectedUserId = null;

        // Set admin online
        localStorage.setItem('admin_online', 'true');
        localStorage.setItem('admin_last_activity', Date.now().toString());

        setInterval(() => {
            localStorage.setItem('admin_last_activity', Date.now().toString());
        }, 30000);

        // ========== LOAD USERS ==========
        function loadUsers() {
            const tbody = document.getElementById('users-table-body');
            
            if (users.length === 0) {
                users = [
                    { id: 1, username: 'admin', password: 'admin123', role: 'admin' },
                    { id: 2, username: 'user', password: 'user123', role: 'user' }
                ];
                localStorage.setItem('users_db', JSON.stringify(users));
            }
            
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.username}</td>
                    <td><span class="role-badge ${user.role}">${user.role}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit-btn" onclick="editUser(${user.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteUser(${user.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('total-admins').textContent = users.filter(u => u.role === 'admin').length;
        }

        // ========== LOAD CHAT USERS ==========
        function loadChatUsers() {
            const userList = document.getElementById('chat-user-list');
            const userMessages = liveChatMessages.filter(m => m.sender === 'user');
            const uniqueUsers = [...new Set(userMessages.map(m => m.sender))];
            
            document.getElementById('active-chats').textContent = uniqueUsers.length;
            document.getElementById('pending-replies').textContent = liveChatMessages.filter(m => !m.read && m.sender === 'user').length;

            if (uniqueUsers.length === 0) {
                userList.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">Belum ada chat dari user</div>';
                return;
            }

            userList.innerHTML = '';
            uniqueUsers.forEach(userId => {
                const userMsg = userMessages.filter(m => m.sender === userId);
                const lastMsg = userMsg[userMsg.length - 1];
                const unread = userMsg.filter(m => !m.read).length;

                const div = document.createElement('div');
                div.className = 'chat-user-item';
                div.onclick = () => selectUser(userId);
                div.innerHTML = `
                    <div class="chat-user-avatar">👤</div>
                    <div class="chat-user-info">
                        <div class="chat-user-name">
                            User
                            ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                        </div>
                        <div class="chat-last-message">${lastMsg.content.substring(0,30)}...</div>
                    </div>
                    <div class="chat-time">${new Date(lastMsg.timestamp).toLocaleTimeString()}</div>
                `;
                userList.appendChild(div);
            });
        }

        function selectUser(userId) {
            selectedUserId = userId;
            document.getElementById('chat-user-list').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('selected-user-name').textContent = 'User';
            
            loadAdminChatMessages();
        }

        function backToUserList() {
            selectedUserId = null;
            document.getElementById('chat-user-list').style.display = 'block';
            document.getElementById('chat-area').style.display = 'none';
        }

        function loadAdminChatMessages() {
            const container = document.getElementById('admin-chat-messages');
            if (!container) return;
            
            const userMessages = liveChatMessages.filter(msg => 
                msg.sender === 'user' || msg.sender === 'admin'
            );
            
            container.innerHTML = '';
            userMessages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `chat-message ${msg.sender}`;
                
                if (msg.type === 'image') {
                    messageDiv.innerHTML = `
                        <img src="${msg.content}" class="chat-message-image" onclick="window.open(this.src)">
                        <div class="message-footer">
                            <span>${new Date(msg.timestamp).toLocaleTimeString()}</span>
                            <span class="message-status-icons">
                                ${msg.read ? '<i class="fas fa-check-double read"></i>' : '<i class="fas fa-check"></i>'}
                            </span>
                        </div>
                    `;
                } else {
                    messageDiv.innerHTML = `
                        ${msg.content}
                        <div class="message-footer">
                            <span>${new Date(msg.timestamp).toLocaleTimeString()}</span>
                            <span class="message-status-icons">
                                ${msg.read ? '<i class="fas fa-check-double read"></i>' : '<i class="fas fa-check"></i>'}
                            </span>
                        </div>
                    `;
                }
                
                container.appendChild(messageDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendAdminMessage() {
            const input = document.getElementById('admin-chat-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            const message = {
                id: Date.now(),
                content: text,
                sender: 'admin',
                timestamp: new Date().toISOString(),
                read: false,
                type: 'text'
            };
            
            liveChatMessages.push(message);
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            
            input.value = '';
            loadAdminChatMessages();
            loadChatUsers();
        }

        // Image upload
        document.getElementById('admin-image-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const message = {
                    id: Date.now(),
                    content: e.target.result,
                    sender: 'admin',
                    timestamp: new Date().toISOString(),
                    read: false,
                    type: 'image'
                };
                
                liveChatMessages.push(message);
                localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
                loadAdminChatMessages();
                loadChatUsers();
            };
            reader.readAsDataURL(file);
        });

        // ========== USER MANAGEMENT ==========
        function openUserModal() {
            document.getElementById('user-modal').classList.add('active');
            document.getElementById('user-form').reset();
        }

        function closeUserModal() {
            document.getElementById('user-modal').classList.remove('active');
        }

        function saveUser(e) {
            e.preventDefault();
            
            const userData = {
                id: Date.now(),
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            
            users.push(userData);
            localStorage.setItem('users_db', JSON.stringify(users));
            
            closeUserModal();
            loadUsers();
        }

        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('modal-title').textContent = 'Edit User';
            document.getElementById('username').value = user.username;
            document.getElementById('password').value = user.password;
            document.getElementById('role').value = user.role;
            
            document.getElementById('user-modal').classList.add('active');
        }

        function deleteUser(userId) {
            if (confirm('Hapus user ini?')) {
                users = users.filter(u => u.id !== userId);
                localStorage.setItem('users_db', JSON.stringify(users));
                loadUsers();
            }
        }

        // ========== LOGOUT ==========
        document.getElementById('logout-admin').addEventListener('click', function() {
            localStorage.setItem('admin_online', 'false');
            localStorage.setItem('admin_last_seen', Date.now().toString());
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            loadChatUsers();
            
            setInterval(() => {
                liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages') || '[]');
                if (selectedUserId) {
                    loadAdminChatMessages();
                }
                loadChatUsers();
            }, 2000);
        });
    </script>
</body>
</html>
