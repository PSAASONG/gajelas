<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteGpt | AI Assistant</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    
    <style>
        /* Perbaikan contact dev */
        .contact-dev {
            padding: 5px 10px;
            font-size: 12px;
            gap: 5px;
        }
        .contact-dev i {
            font-size: 12px;
        }
        
        /* Devil loader dengan robot */
        .devil-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        .devil-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .devil-character {
            position: relative;
            width: 120px;
            height: 150px;
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .devil-head {
            position: relative;
            width: 80px;
            height: 80px;
            background: #ff4444;
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(255,68,68,0.5);
        }
        .devil-horn {
            position: absolute;
            top: -15px;
            width: 20px;
            height: 30px;
            background: #333;
            border-radius: 50% 50% 0 0;
        }
        .devil-horn.left { left: 10px; transform: rotate(-20deg); }
        .devil-horn.right { right: 10px; transform: rotate(20deg); }
        .devil-eye {
            position: absolute;
            top: 25px;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
        }
        .devil-eye.left { left: 20px; }
        .devil-eye.right { right: 20px; }
        .devil-eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 5px;
            height: 5px;
            background: #333;
            border-radius: 50%;
        }
        .devil-smile {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 10px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 15px 15px;
        }
        .devil-body {
            width: 60px;
            height: 40px;
            background: #cc0000;
            margin: 0 auto;
            border-radius: 0 0 20px 20px;
        }
        .devil-arm {
            position: absolute;
            bottom: 40px;
            width: 15px;
            height: 40px;
            background: #cc0000;
            border-radius: 10px;
        }
        .devil-arm.left { left: -10px; transform: rotate(20deg); animation: wave 2s infinite; }
        .devil-arm.right { right: -10px; transform: rotate(-20deg); }
        @keyframes wave {
            0%,100% { transform: rotate(20deg); }
            50% { transform: rotate(40deg); }
        }
        .devil-tail {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 15px;
            height: 30px;
            background: #cc0000;
            border-radius: 50%;
            transform: rotate(45deg);
        }
        .energy-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ff4444;
            border-radius: 50%;
            animation: particle 2s infinite;
        }
        .energy-particle:nth-child(1) { top: 0; left: 50%; animation-delay: 0s; }
        .energy-particle:nth-child(2) { top: 20%; right: 0; animation-delay: 0.2s; }
        .energy-particle:nth-child(3) { bottom: 20%; left: 0; animation-delay: 0.4s; }
        .energy-particle:nth-child(4) { bottom: 0; right: 30%; animation-delay: 0.6s; }
        .energy-particle:nth-child(5) { top: 30%; left: 10%; animation-delay: 0.8s; }
        @keyframes particle {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .loading-text {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .loading-dots {
            display: flex;
            gap: 0.25rem;
        }
        .loading-dots span {
            width: 0.375rem;
            height: 0.375rem;
            background: white;
            border-radius: 50%;
            animation: loadingDots 1.4s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loadingDots {
            0%,60%,100% { transform: scale(1); opacity: 0.3; }
            30% { transform: scale(1.5); opacity: 1; }
        }
        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8888);
            animation: progress 2s infinite;
            width: 30%;
        }
        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        /* Thinking robot */
        .thinking-robot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 30px;
            border: 1px solid var(--border);
            animation: robotPulse 1.5s ease infinite;
            width: fit-content;
        }
        .robot-icon {
            font-size: 20px;
            color: var(--accent-primary);
            animation: robotThink 1s ease infinite;
        }
        @keyframes robotThink {
            0%,100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
        }
        .robot-dots {
            display: flex;
            gap: 4px;
        }
        .robot-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: robotBounce 1.4s infinite ease-in-out;
        }
        .robot-dots span:nth-child(1) { animation-delay: -0.32s; }
        .robot-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes robotBounce {
            0%,80%,100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        .robot-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        @keyframes robotPulse {
            0%,100% { box-shadow: 0 0 5px rgba(255,68,68,0.2); }
            50% { box-shadow: 0 0 15px rgba(255,68,68,0.4); }
        }
        .thinking-completed {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            margin: 5px 0;
            color: var(--success);
            font-size: 12px;
            width: fit-content;
            border: 1px solid rgba(76,175,80,0.2);
        }
    </style>
</head>

    <script>
        // ========== CEK LOGIN ==========
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (!currentUser.username) window.location.href = 'login.html';
        if (currentUser.role === 'admin') document.getElementById('admin-panel-btn').style.display = 'flex';

        // ========== GLOBAL ==========
        let messages = [];
        let chatHistories = JSON.parse(localStorage.getItem('chatHistories') || '[]');
        let currentChatId = localStorage.getItem('currentChatId') || null;
        let isProcessing = false;
        let liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages') || '[]');
        let adminOnline = localStorage.getItem('admin_online') === 'true';

        // ========== API KEY ==========
        function getApiKey() {
            if (window.CONFIG && window.CONFIG.API_KEYS) {
                return window.CONFIG.API_KEYS[Math.floor(Math.random() * window.CONFIG.API_KEYS.length)];
            } else if (window.API_KEYS) {
                return window.API_KEYS[Math.floor(Math.random() * window.API_KEYS.length)];
            }
            return null;
        }

        // ========== THINKING UI ==========
        function showThinking() {
            const chatWindow = document.getElementById('chat-window');
            const container = document.createElement('div');
            container.className = 'message-container ai';
            container.id = 'thinking-container';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar ai-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = '<div class="thinking-robot"><div class="robot-icon">🤖</div><div class="robot-dots"><span></span><span></span><span></span></div><span class="robot-label">THINKING</span></div>';
            
            container.appendChild(avatar);
            container.appendChild(wrapper);
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideThinking() {
            const el = document.getElementById('thinking-container');
            if (el) el.remove();
        }

        function showThinkingCompleted() {
            const chatWindow = document.getElementById('chat-window');
            const container = document.createElement('div');
            container.className = 'message-container ai';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar ai-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = '<div class="thinking-completed"><i class="fas fa-check-circle"></i><span>Thinking completed</span></div>';
            
            container.appendChild(avatar);
            container.appendChild(wrapper);
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            setTimeout(() => {
                if (container.parentNode) container.remove();
            }, 2000);
        }

        // ========== DISPLAY MESSAGE ==========
        function displayMessage(content, sender) {
            const chatWindow = document.getElementById('chat-window');
            const welcome = document.getElementById('welcome-screen');
            if (welcome && welcome.style.display !== 'none') welcome.style.display = 'none';

            const container = document.createElement('div');
            container.className = `message-container ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}`;
            avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            msgDiv.textContent = content;

            const time = document.createElement('div');
            time.className = 'message-time';
            const now = new Date();
            time.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(time);

            if (sender === 'user') {
                container.appendChild(wrapper);
                container.appendChild(avatar);
            } else {
                container.appendChild(avatar);
                container.appendChild(wrapper);
            }

            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ========== SEND MESSAGE ==========
        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            displayMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';

            isProcessing = true;
            document.getElementById('send-button').disabled = true;
            showThinking();

            messages.push({ role: 'user', content: text });

            try {
                const apiKey = getApiKey();
                if (!apiKey) throw new Error('No API key');

                const systemPrompt = window.SYSTEM_PROMPT || "Kamu adalah asisten AI yang membantu.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Maaf, tidak ada respons.';

                hideThinking();
                showThinkingCompleted();
                displayMessage(aiText, 'ai');
                
                messages.push({ role: 'model', content: aiText });
                saveCurrentChat();

            } catch (error) {
                console.error('API Error:', error);
                hideThinking();
                displayMessage('❌ Gagal terhubung ke API. Coba lagi nanti.', 'ai');
            } finally {
                isProcessing = false;
                document.getElementById('send-button').disabled = false;
            }
        }

        // ========== SAVE CHAT ==========
        function saveCurrentChat() {
            if (messages.length === 0) return;
            
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                localStorage.setItem('currentChatId', currentChatId);
            }
            
            const chatData = {
                id: currentChatId,
                title: messages[0]?.content?.substring(0, 30) || 'New Chat',
                messages: [...messages],
                timestamp: new Date().toISOString()
            };
            
            const index = chatHistories.findIndex(c => c.id === currentChatId);
            if (index !== -1) {
                chatHistories[index] = chatData;
            } else {
                chatHistories.unshift(chatData);
            }
            
            localStorage.setItem('chatHistories', JSON.stringify(chatHistories));
            loadRecentChats();
        }

        // ========== LOAD CHAT ==========
        function loadChat(id) {
            const chat = chatHistories.find(c => c.id === id);
            if (!chat) return;
            
            currentChatId = id;
            localStorage.setItem('currentChatId', id);
            messages = [...chat.messages];
            
            document.getElementById('chat-window').innerHTML = '';
            messages.forEach(m => displayMessage(m.content, m.role === 'user' ? 'user' : 'ai'));
            loadRecentChats();
        }

        // ========== NEW CHAT ==========
        function newChat() {
            if (messages.length > 0) saveCurrentChat();
            
            messages = [];
            currentChatId = null;
            localStorage.removeItem('currentChatId');
            
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('welcome-screen').style.display = 'block';
            loadRecentChats();
        }

        // ========== RECENT CHATS ==========
        function loadRecentChats() {
            const container = document.getElementById('recent-chats');
            if (!container) return;
            
            if (chatHistories.length === 0) {
                container.innerHTML = '<div class="no-chats">No chats yet</div>';
                return;
            }
            
            container.innerHTML = '';
            chatHistories.slice(0, 10).forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.dataset.id = chat.id;
                div.innerHTML = `
                    <i class="fas fa-comment"></i>
                    <span class="chat-title">${chat.title}</span>
                    <button class="delete-chat-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')"><i class="fas fa-times"></i></button>
                `;
                div.addEventListener('click', () => loadChat(chat.id));
                container.appendChild(div);
            });
        }

        window.deleteChat = function(id) {
            if (!confirm('Hapus chat ini?')) return;
            chatHistories = chatHistories.filter(c => c.id !== id);
            localStorage.setItem('chatHistories', JSON.stringify(chatHistories));
            if (currentChatId === id) newChat();
            else loadRecentChats();
        };

        // ========== LIVE CHAT ==========
        function updateAdminStatus() {
            const online = localStorage.getItem('admin_online') === 'true';
            document.getElementById('admin-status-header').className = online ? 'admin-status online' : 'admin-status offline';
            document.getElementById('admin-status-text').innerText = online ? 'Online' : 'Offline';
            document.getElementById('modal-admin-status').className = online ? 'admin-status online' : 'admin-status offline';
            document.getElementById('modal-status-text').innerText = online ? 'Online' : 'Offline';
        }

        function loadLiveChatMessages() {
            const container = document.getElementById('live-chat-messages');
            if (!container) return;
            container.innerHTML = '';
            liveChatMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `chat-message ${msg.sender}`;
                div.innerHTML = msg.content + '<div class="message-footer">' + new Date(msg.timestamp).toLocaleTimeString() + '</div>';
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
            document.getElementById('unread-count').innerText = liveChatMessages.filter(m => !m.read && m.sender === 'admin').length;
        }

        window.openLiveChat = function() {
            document.getElementById('live-chat-modal').classList.add('active');
            liveChatMessages.forEach(m => { if (m.sender === 'admin') m.read = true; });
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            loadLiveChatMessages();
        };

        window.closeLiveChat = function() {
            document.getElementById('live-chat-modal').classList.remove('active');
        };

        window.sendLiveChatMessage = function() {
            const input = document.getElementById('live-chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const msg = {
                id: Date.now(),
                content: text,
                sender: 'user',
                timestamp: new Date().toISOString(),
                read: false
            };
            liveChatMessages.push(msg);
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            input.value = '';
            loadLiveChatMessages();
            
            setTimeout(() => {
                const reply = {
                    id: Date.now()+1,
                    content: 'Pesan Anda telah diterima. Admin akan segera membalas.',
                    sender: 'admin',
                    timestamp: new Date().toISOString(),
                    read: false
                };
                liveChatMessages.push(reply);
                localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
                loadLiveChatMessages();
                document.getElementById('unread-count').innerText = '1';
            }, 2000);
        };

        // ========== VOICE NOTE ==========
        document.getElementById('voice-note-btn').addEventListener('click', function() {
            if (!('webkitSpeechRecognition' in window)) {
                alert('Browser tidak mendukung voice note');
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'id-ID';
            this.classList.add('recording');
            this.innerHTML = '<i class="fas fa-stop"></i>';
            recognition.start();

            recognition.onresult = (e) => {
                document.getElementById('chat-input').value = e.results[0][0].transcript;
            };
            recognition.onend = () => {
                this.classList.remove('recording');
                this.innerHTML = '<i class="fas fa-microphone"></i>';
            };
        });

        // ========== FILE UPLOAD ==========
        document.getElementById('file-button').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('preview-file-name').innerText = file.name;
            document.getElementById('preview-file-size').innerText = (file.size/1024).toFixed(2)+' KB';
            document.getElementById('file-preview').classList.add('active');
        });
        document.getElementById('remove-file').addEventListener('click', function() {
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview').classList.remove('active');
        });
        document.getElementById('photo-button').addEventListener('click', () => document.getElementById('photo-input').click());
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                displayMessage('📷 [Gambar]', 'user');
                setTimeout(() => displayMessage('Gambar diterima!', 'ai'), 1000);
            };
            reader.readAsDataURL(file);
        });

        // ========== DROPDOWN ==========
        document.getElementById('menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdown-menu').classList.toggle('show');
        });
        document.addEventListener('click', () => document.getElementById('dropdown-menu').classList.remove('show'));

        document.getElementById('refresh-api-btn').addEventListener('click', () => {
            displayMessage('✅ API Key direfresh', 'ai');
            document.getElementById('dropdown-menu').classList.remove('show');
        });
        document.getElementById('new-chat-btn').addEventListener('click', newChat);
        document.getElementById('admin-panel-btn').addEventListener('click', () => window.location.href = 'admin.html');
        document.getElementById('logout-btn').addEventListener('click', () => { localStorage.clear(); window.location.href = 'login.html'; });
        document.getElementById('logout-sidebar').addEventListener('click', () => { localStorage.clear(); window.location.href = 'login.html'; });

        // ========== SIDEBAR ==========
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('visible');
            document.getElementById('sidebar-overlay').classList.toggle('visible');
        });
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('visible');
            document.getElementById('sidebar-overlay').classList.toggle('visible');
        });
        document.getElementById('sidebar-overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('visible');
            document.getElementById('sidebar-overlay').classList.remove('visible');
        });
        document.getElementById('new-chat-sidebar').addEventListener('click', newChat);

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        document.getElementById('chat-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('app-header').innerText = 'WhiteGpt';
            document.getElementById('sidebar-username').innerText = currentUser.username || 'Guest User';
            
            updateAdminStatus();
            loadLiveChatMessages();
            loadRecentChats();
            
            if (currentChatId) {
                const chat = chatHistories.find(c => c.id === currentChatId);
                if (chat) {
                    messages = chat.messages;
                    document.getElementById('chat-window').innerHTML = '';
                    messages.forEach(m => displayMessage(m.content, m.role === 'user' ? 'user' : 'ai'));
                }
            }
            
            setInterval(() => {
                const newStatus = localStorage.getItem('admin_online') === 'true';
                if (newStatus !== adminOnline) {
                    adminOnline = newStatus;
                    updateAdminStatus();
                }
            }, 5000);
            
            setTimeout(() => {
                const loader = document.getElementById('devil-loader');
                if (loader) loader.classList.add('hidden');
            }, 2000);
        });
    </script>
</body>
</html>
