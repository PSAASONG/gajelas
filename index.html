<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteGpt | AI Assistant</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    
    <style>
        /* Perbaikan tambahan */
        .contact-dev {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .sidebar-section {
            overflow-y: auto;
            max-height: calc(100vh - 350px);
        }
        
        .thinking-robot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 30px;
            border: 1px solid var(--border);
            animation: robotPulse 1.5s ease infinite;
            width: fit-content;
        }
        
        .thinking-completed {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 20px;
            margin: 5px 0;
            color: var(--success);
            font-size: 12px;
            width: fit-content;
            border: 1px solid rgba(76,175,80,0.2);
        }
        
        .message-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin: 12px 0;
            animation: messageSlide 0.3s ease;
        }
        
        .message-container.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: var(--accent-primary);
            color: white;
        }
        
        .ai-avatar {
            background: #2d2d2d;
            color: var(--accent-primary);
            border: 1px solid var(--border);
        }
        
        .message-wrapper {
            max-width: 70%;
        }
        
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .user-message {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .ai-message {
            background: var(--bg-card);
            color: var(--text-secondary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }
        
        .message-time {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            text-align: right;
        }
        
        /* Recent chats */
        .chat-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .chat-item:hover {
            background: rgba(255,68,68,0.1);
        }
        
        .chat-item.active {
            background: rgba(255,68,68,0.2);
            border-left: 2px solid var(--accent-primary);
        }
        
        .chat-title {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .delete-chat-btn {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }
        
        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }
        
        .delete-chat-btn:hover {
            color: var(--error);
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fas fa-bolt"></i>
                <span>WhiteGpt</span>
            </div>
            <button id="toggle-sidebar"><i class="fas fa-chevron-left"></i></button>
        </div>
        
        <div class="sidebar-user">
            <div class="sidebar-avatar"><i class="fas fa-user"></i></div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebar-username">Guest User</div>
                <div class="sidebar-user-status"><span class="status-dot"></span> Online</div>
            </div>
        </div>
        
        <button id="new-chat-sidebar" class="new-chat-btn-sidebar"><i class="fas fa-plus"></i> New Chat</button>
        
        <!-- LIVE CHAT SUPPORT (HANYA UNTUK USER) -->
        <div class="live-chat-section">
            <div class="live-chat-header">
                <h4>LIVE CHAT SUPPORT</h4>
                <div class="admin-status" id="admin-status-header"><span class="status-dot"></span><span id="admin-status-text">Offline</span></div>
            </div>
            <div class="chat-user-item" onclick="openLiveChat()">
                <div class="chat-user-avatar"><i class="fas fa-headset"></i></div>
                <div class="chat-user-info">
                    <div class="chat-user-name">Admin Support <span class="unread-badge" id="unread-count">0</span></div>
                    <div class="chat-last-message"><span class="message-status"><i class="fas fa-check"></i></span> <span id="last-message-text">Klik untuk chat</span></div>
                </div>
                <div class="chat-time" id="last-seen-time"></div>
            </div>
        </div>
        
        <!-- RECENT CHATS -->
        <div class="sidebar-section">
            <div class="sidebar-label">
                Recent Chats
                <button id="clear-all-chats" class="clear-chats-btn"><i class="fas fa-trash-alt"></i></button>
            </div>
            <div id="recent-chats" class="recent-chats-list"></div>
        </div>
        
        <button id="logout-sidebar" class="logout-btn-sidebar"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </aside>
    
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- DEVIL LOADER -->
    <div class="devil-loader" id="devil-loader">
        <div class="devil-character">...</div>
        <div class="loading-text">Loading <div class="loading-dots"><span></span><span></span><span></span></div></div>
        <div class="loading-progress"><div class="loading-progress-bar"></div></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <div class="logo"><i class="fas fa-bolt"></i><h1 id="app-header">WhiteGpt</h1></div>
                </div>
                <div class="header-right">
                    <div class="status-indicator online" id="status-indicator"><span class="status-dot"></span><span>Online</span></div>
                    <div class="dropdown">
                        <button id="menu-btn" class="control-btn"><i class="fas fa-ellipsis-v"></i></button>
                        <div id="dropdown-menu" class="dropdown-menu">
                            <button id="refresh-api-btn" class="dropdown-item"><i class="fas fa-sync-alt"></i> Refresh API</button>
                            <button id="new-chat-btn" class="dropdown-item"><i class="fas fa-plus"></i> Chat Baru</button>
                            <button id="history-btn" class="dropdown-item"><i class="fas fa-history"></i> Riwayat</button>
                            <button id="admin-panel-btn" class="dropdown-item" style="display:none;"><i class="fas fa-user-shield"></i> Admin Panel</button>
                            <div class="dropdown-divider"></div>
                            <button id="logout-btn" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Keluar</button>
                        </div>
                    </div>
                    <a href="https://t.me/RianModss" target="_blank" class="contact-dev"><i class="fab fa-telegram"></i> Contact Dev</a>
                </div>
            </div>
        </header>

        <!-- CHAT WINDOW -->
        <div id="chat-window" class="chat-window">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon"><i class="fas fa-bolt"></i></div>
                <h2>Selamat datang di WhiteGpt</h2>
                <p>AI Assistant siap membantu Anda</p>
                <div class="feature-cards">
                    <div class="feature-card"><i class="fas fa-code"></i><h4>Coding</h4><p>Bantuan coding</p></div>
                    <div class="feature-card"><i class="fas fa-file-code"></i><h4>File</h4><p>Upload file</p></div>
                    <div class="feature-card"><i class="fas fa-comments"></i><h4>History</h4><p>Riwayat chat</p></div>
                </div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div id="input-area" class="input-area">
            <div class="file-preview" id="file-preview">
                <div class="file-preview-content">
                    <div class="file-preview-info"><i class="fas fa-file-code"></i><div class="file-info"><span id="preview-file-name"></span><span id="preview-file-size"></span></div></div>
                    <button class="remove-file" id="remove-file"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="input-wrapper">
                <div class="input-controls-left">
                    <input type="file" id="file-input" style="display:none;">
                    <button id="file-button" class="input-icon-btn"><i class="fas fa-paperclip"></i></button>
                    <button id="photo-button" class="input-icon-btn"><i class="fas fa-image"></i></button>
                </div>
                <div class="input-container">
                    <textarea id="chat-input" placeholder="Ketik pesan..." rows="1"></textarea>
                </div>
                <div class="input-controls-right">
                    <button id="voice-note-btn" class="input-icon-btn"><i class="fas fa-microphone"></i></button>
                    <button id="send-button" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- LIVE CHAT MODAL (untuk user) -->
    <div id="live-chat-modal" class="live-chat-modal">
        <div class="live-chat-header-modal">
            <div class="live-chat-user-info">
                <div class="live-chat-user-avatar"><i class="fas fa-headset"></i></div>
                <div><h5>Admin Support</h5><div class="admin-status" id="modal-admin-status"><span class="status-dot"></span><span id="modal-status-text">Offline</span></div></div>
            </div>
            <button class="close-chat" onclick="closeLiveChat()"><i class="fas fa-times"></i></button>
        </div>
        <div id="live-chat-messages" class="live-chat-messages"></div>
        <div class="live-chat-input-area">
            <div class="live-chat-input-wrapper">
                <input type="file" id="chat-image-input" style="display:none;">
                <button class="chat-action-btn" onclick="document.getElementById('chat-image-input').click()"><i class="fas fa-image"></i></button>
                <input type="text" id="live-chat-input" placeholder="Ketik pesan...">
                <button class="chat-action-btn" id="voice-chat-btn"><i class="fas fa-microphone"></i></button>
                <button class="chat-send-btn" onclick="sendLiveChatMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <input type="file" id="photo-input" accept="image/*" style="display:none;">

    <!-- Scripts -->
    <script src="config.json"></script>
    <script src="apikey.js"></script>
    <script src="cadangan.js"></script>
    <script src="role-manager.js"></script>
    <script src="auth-new.js"></script>
    <script src="keamanan.js"></script>

    <script>
        // ========== CEK LOGIN ==========
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (!currentUser.username) window.location.href = 'login.html';
        if (currentUser.role === 'admin') document.getElementById('admin-panel-btn').style.display = 'flex';

        // ========== GLOBAL ==========
        let messages = [];
        let chatHistories = JSON.parse(localStorage.getItem('chatHistories') || '[]');
        let currentChatId = localStorage.getItem('currentChatId') || null;
        let isProcessing = false;
        let liveChatMessages = JSON.parse(localStorage.getItem('live_chat_messages') || '[]');
        let adminOnline = localStorage.getItem('admin_online') === 'true';

        // ========== API KEY ==========
        function getApiKey() {
            if (window.CONFIG && window.CONFIG.API_KEYS) {
                return window.CONFIG.API_KEYS[Math.floor(Math.random() * window.CONFIG.API_KEYS.length)];
            } else if (window.API_KEYS) {
                return window.API_KEYS[Math.floor(Math.random() * window.API_KEYS.length)];
            }
            return null;
        }

        // ========== THINKING UI ==========
        function showThinking() {
            const chatWindow = document.getElementById('chat-window');
            const container = document.createElement('div');
            container.className = 'message-container ai';
            container.id = 'thinking-container';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar ai-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = '<div class="thinking-robot"><div class="robot-icon">🤖</div><div class="robot-dots"><span></span><span></span><span></span></div><span class="robot-label">THINKING</span></div>';
            
            container.appendChild(avatar);
            container.appendChild(wrapper);
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideThinking() {
            const el = document.getElementById('thinking-container');
            if (el) el.remove();
        }

        function showThinkingCompleted() {
            const chatWindow = document.getElementById('chat-window');
            const container = document.createElement('div');
            container.className = 'message-container ai';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar ai-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = '<div class="thinking-completed"><i class="fas fa-check-circle"></i><span>Thinking completed</span></div>';
            
            container.appendChild(avatar);
            container.appendChild(wrapper);
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            setTimeout(() => {
                if (container.parentNode) container.remove();
            }, 2000);
        }

        // ========== DISPLAY MESSAGE ==========
        function displayMessage(content, sender) {
            const chatWindow = document.getElementById('chat-window');
            const welcome = document.getElementById('welcome-screen');
            if (welcome && welcome.style.display !== 'none') welcome.style.display = 'none';

            const container = document.createElement('div');
            container.className = `message-container ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}`;
            avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            msgDiv.textContent = content; // pakai textContent biar aman

            const time = document.createElement('div');
            time.className = 'message-time';
            const now = new Date();
            time.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(time);

            if (sender === 'user') {
                container.appendChild(wrapper);
                container.appendChild(avatar);
            } else {
                container.appendChild(avatar);
                container.appendChild(wrapper);
            }

            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ========== SEND MESSAGE ==========
        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            displayMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';

            isProcessing = true;
            document.getElementById('send-button').disabled = true;
            showThinking();

            // Simpan pesan user ke messages
            messages.push({ role: 'user', content: text });

            // Coba panggil API
            try {
                const apiKey = getApiKey();
                if (!apiKey) throw new Error('No API key');

                const systemPrompt = window.SYSTEM_PROMPT || "Kamu adalah asisten AI yang membantu.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Maaf, tidak ada respons.';

                hideThinking();
                showThinkingCompleted();
                displayMessage(aiText, 'ai');
                
                messages.push({ role: 'model', content: aiText });
                saveCurrentChat();

            } catch (error) {
                console.error('API Error:', error);
                hideThinking();
                displayMessage('❌ Gagal terhubung ke API. Coba lagi nanti.', 'ai');
            } finally {
                isProcessing = false;
                document.getElementById('send-button').disabled = false;
            }
        }

        // ========== SAVE CHAT ==========
        function saveCurrentChat() {
            if (messages.length === 0) return;
            
            if (!currentChatId) {
                currentChatId = Date.now().toString();
                localStorage.setItem('currentChatId', currentChatId);
            }
            
            const chatData = {
                id: currentChatId,
                title: messages[0]?.content?.substring(0, 30) || 'New Chat',
                messages: [...messages],
                timestamp: new Date().toISOString()
            };
            
            const index = chatHistories.findIndex(c => c.id === currentChatId);
            if (index !== -1) {
                chatHistories[index] = chatData;
            } else {
                chatHistories.unshift(chatData);
            }
            
            localStorage.setItem('chatHistories', JSON.stringify(chatHistories));
            loadRecentChats();
        }

        // ========== LOAD CHAT ==========
        function loadChat(id) {
            const chat = chatHistories.find(c => c.id === id);
            if (!chat) return;
            
            currentChatId = id;
            localStorage.setItem('currentChatId', id);
            messages = [...chat.messages];
            
            document.getElementById('chat-window').innerHTML = '';
            messages.forEach(m => displayMessage(m.content, m.role === 'user' ? 'user' : 'ai'));
            loadRecentChats();
        }

        // ========== NEW CHAT ==========
        function newChat() {
            if (messages.length > 0) saveCurrentChat();
            
            messages = [];
            currentChatId = null;
            localStorage.removeItem('currentChatId');
            
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('welcome-screen').style.display = 'block';
            loadRecentChats();
        }

        // ========== RECENT CHATS ==========
        function loadRecentChats() {
            const container = document.getElementById('recent-chats');
            if (!container) return;
            
            if (chatHistories.length === 0) {
                container.innerHTML = '<div class="no-chats">No chats yet</div>';
                return;
            }
            
            container.innerHTML = '';
            chatHistories.slice(0, 10).forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.dataset.id = chat.id;
                div.innerHTML = `
                    <i class="fas fa-comment"></i>
                    <span class="chat-title">${chat.title}</span>
                    <button class="delete-chat-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')"><i class="fas fa-times"></i></button>
                `;
                div.addEventListener('click', () => loadChat(chat.id));
                container.appendChild(div);
            });
        }

        window.deleteChat = function(id) {
            if (!confirm('Hapus chat ini?')) return;
            chatHistories = chatHistories.filter(c => c.id !== id);
            localStorage.setItem('chatHistories', JSON.stringify(chatHistories));
            if (currentChatId === id) newChat();
            else loadRecentChats();
        };

        // ========== LIVE CHAT ==========
        function updateAdminStatus() {
            const online = localStorage.getItem('admin_online') === 'true';
            document.getElementById('admin-status-header').className = online ? 'admin-status online' : 'admin-status offline';
            document.getElementById('admin-status-text').innerText = online ? 'Online' : 'Offline';
            document.getElementById('modal-admin-status').className = online ? 'admin-status online' : 'admin-status offline';
            document.getElementById('modal-status-text').innerText = online ? 'Online' : 'Offline';
        }

        function loadLiveChatMessages() {
            const container = document.getElementById('live-chat-messages');
            if (!container) return;
            container.innerHTML = '';
            liveChatMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `chat-message ${msg.sender}`;
                div.innerHTML = msg.content + '<div class="message-footer">' + new Date(msg.timestamp).toLocaleTimeString() + '</div>';
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
            document.getElementById('unread-count').innerText = liveChatMessages.filter(m => !m.read && m.sender === 'admin').length;
        }

        window.openLiveChat = function() {
            document.getElementById('live-chat-modal').classList.add('active');
            liveChatMessages.forEach(m => { if (m.sender === 'admin') m.read = true; });
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            loadLiveChatMessages();
        };

        window.closeLiveChat = function() {
            document.getElementById('live-chat-modal').classList.remove('active');
        };

        window.sendLiveChatMessage = function() {
            const input = document.getElementById('live-chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const msg = {
                id: Date.now(),
                content: text,
                sender: 'user',
                timestamp: new Date().toISOString(),
                read: false
            };
            liveChatMessages.push(msg);
            localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
            input.value = '';
            loadLiveChatMessages();
            
            // Balasan otomatis dari admin (simulasi)
            setTimeout(() => {
                const reply = {
                    id: Date.now()+1,
                    content: 'Pesan Anda telah diterima. Admin akan segera membalas.',
                    sender: 'admin',
                    timestamp: new Date().toISOString(),
                    read: false
                };
                liveChatMessages.push(reply);
                localStorage.setItem('live_chat_messages', JSON.stringify(liveChatMessages));
                loadLiveChatMessages();
                document.getElementById('unread-count').innerText = '1';
            }, 2000);
        };

        // ========== VOICE NOTE ==========
        document.getElementById('voice-note-btn').addEventListener('click', function() {
            if (!('webkitSpeechRecognition' in window)) {
                alert('Browser tidak mendukung voice note');
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'id-ID';
            this.classList.add('recording');
            this.innerHTML = '<i class="fas fa-stop"></i>';
            recognition.start();

            recognition.onresult = (e) => {
                document.getElementById('chat-input').value = e.results[0][0].transcript;
            };
            recognition.onend = () => {
                this.classList.remove('recording');
                this.innerHTML = '<i class="fas fa-microphone"></i>';
            };
        });

        // ========== FILE UPLOAD ==========
        document.getElementById('file-button').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('preview-file-name').innerText = file.name;
            document.getElementById('preview-file-size').innerText = (file.size/1024).toFixed(2)+' KB';
            document.getElementById('file-preview').classList.add('active');
        });
        document.getElementById('remove-file').addEventListener('click', function() {
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview').classList.remove('active');
        });
        document.getElementById('photo-button').addEventListener('click', () => document.getElementById('photo-input').click());
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                displayMessage('📷 [Gambar]', 'user');
                setTimeout(() => displayMessage('Gambar diterima!', 'ai'), 1000);
            };
            reader.readAsDataURL(file);
        });

        // ========== DROPDOWN ==========
        document.getElementById('menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdown-menu').classList.toggle('show');
        });
        document.addEventListener('click', () => document.getElementById('dropdown-menu').classList.remove('show'));

        document.getElementById('refresh-api-btn').addEventListener('click', () => {
            displayMessage('✅ API Key direfresh', 'ai');
            document.getElementById('dropdown-menu').classList.remove('show');
        });
        document.getElementById('new-chat-btn').addEventListener('click', newChat);
        document.getElementById('admin-panel-btn').addEventListener('click', () => window.location.href = 'admin.html');
        document.getElementById('logout-btn').addEventListener('click', () => { localStorage.clear(); window.location.href = 'login.html'; });
        document.getElementById('logout-sidebar').addEventListener('click', () => { localStorage.clear(); window.location.href = 'login.html'; });

        // ========== SIDEBAR ==========
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('visible');
            document.getElementById('sidebar-overlay').classList.toggle('visible');
        });
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('visible');
            document.getElementById('sidebar-overlay').classList.toggle('visible');
        });
        document.getElementById('sidebar-overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('visible');
            document.getElementById('sidebar-overlay').classList.remove('visible');
        });
        document.getElementById('new-chat-sidebar').addEventListener('click', newChat);

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('app-header').innerText = 'WhiteGpt';
            document.getElementById('sidebar-username').innerText = currentUser.username || 'Guest User';
            
            updateAdminStatus();
            loadLiveChatMessages();
            loadRecentChats();
            
            if (currentChatId) {
                const chat = chatHistories.find(c => c.id === currentChatId);
                if (chat) {
                    messages = chat.messages;
                    document.getElementById('chat-window').innerHTML = '';
                    messages.forEach(m => displayMessage(m.content, m.role === 'user' ? 'user' : 'ai'));
                }
            }
            
            setInterval(() => {
                const newStatus = localStorage.getItem('admin_online') === 'true';
                if (newStatus !== adminOnline) {
                    adminOnline = newStatus;
                    updateAdminStatus();
                }
            }, 5000);
            
            setTimeout(() => {
                const loader = document.getElementById('devil-loader');
                if (loader) loader.classList.add('hidden');
            }, 2000);
        });
    </script>
</body>
</html>
